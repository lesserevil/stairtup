<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwwgUagKOQW/zyKjU1u9A9j9/25T7yKtP+9Z00/7o00/0" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        .subtitle {
            margin-top: 10px;
            opacity: 0.9;
            font-size: 1.2em;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #10b981;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🏢 {{ title }}</h1>
        <div class="subtitle">
            <span class="status-indicator"></span>
            Self-organizing multi-agent company system
        </div>
    </header>

    <main>
        <p>Welcome to the Agent Company Swarm.</p>
        <p><a href="/dashboard" style="font-size: 1.2em; color: #667eea; text-decoration: none; font-weight: bold;">📊 Go to Dashboard →</a></p>
        <p>This system is under active development.</p>
    </main>
</body>
</html>
